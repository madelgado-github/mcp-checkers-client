# Copy this file to config.ini (gitignored) and adjust.
# Every value is also the default inside play_checkers.py.

[qwen]
# VERIFIED endpoint of the token plan (Qwen Cloud token plan, OpenAI-
# compatible). The Coding plan one (https://coding.dashscope.aliyuncs.com/v1)
# answers 401 to this key: it is NOT the token plan.
base_url = https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
# Plan models (real listing): qwen3.6/3.8-flash, qwen3.7-plus/max,
# qwen3.8-max, glm-5.2/5.3, deepseek-v4-flash/pro (+ "auto").
#  - qwen3.8-flash   : default, fast with enable_thinking=false (~2 s/move)
#  - qwen3.7-plus    : good quality/speed balance
#  - qwen3.8-max     : the strongest, but slow
model = qwen3.8-flash
# REASONING: the token-plan endpoint reasons BY DEFAULT with qwen3.8-flash:
# 2-3 min per real move (measured). With false it answers in ~2 s (verified
# live 2026-10-20). true = plays stronger but 2-3 min/move.
# Leave it EMPTY to not send the flag (endpoints that do not know it).
enable_thinking = false
# OPTIONAL LEGACY, DISCOURAGED (last resort). Key resolution order (see
# key_source.py and README): 1) QWEN_API_KEY environment variable,
# 2) key box on the pairing page (process memory only), 3) this file, ONLY
# if it exists. A secret on disk is the weak point of the flow: rotate the
# key if it ever lived here and prefer env or the key box.
key_file = qwen.key

[webmcp]
# port of the @jason.today/webmcp relay daemon (historic port of the package)
port = 4797

[site]
# 8088 is the port of the LOCAL TOKEN SERVER only: it serves the pairing page
# (/_pairing) and the key box (/qwen-key). It does NOT serve the game — the
# board lives exclusively on prod_origin below. Change it only if the port is
# taken by another server.
http_port = 8088
# production origin: the ONLY game channel. The 2 board links (EN + ES)
# printed in the terminal and on /_pairing are built from it
# (<prod_origin>/games/checkers/ and <prod_origin>/es/juegos/checkers/).
# Pairing works from ANY origin (tools are detected by suffix checkers_*).
prod_origin = https://tabandblank.com

[agent]
difficulty = medium
# 20 s < 30 s: the bridge relay cuts ANY tools/call at 30 s (verified in the
# v0.1.12/0.1.13 source). Never leave the glue's 60 default in place.
wait_seconds = 20
max_turns = 120
# timeout per LLM call: with thinking off, 90 s is plenty (typical answer
# ~2 s). Raise to 180+ only if you set enable_thinking = true (2-3 min/move).
llm_timeout = 90
