# Copia este archivo a config.ini (gitignored) y ajusta.
# Todos los valores son también los defaults de play_checkers.py.

[qwen]
# Endpoint VERIFICADO del plan de tokens (Qwen Cloud token plan, OpenAI-
# compatible). El del plan Coding (https://coding.dashscope.aliyuncs.com/v1)
# responde 401 a esta key: NO es el plan de tokens.
base_url = https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
# Modelos del plan (listado real): qwen3.6/3.8-flash, qwen3.7-plus/max,
# qwen3.8-max, glm-5.2/5.3, deepseek-v4-flash/pro (+ "auto").
#  - qwen3.8-flash   : default, rápido con enable_thinking=false (~2 s/jugada)
#  - qwen3.7-plus    : buena relación calidad/velocidad
#  - qwen3.8-max     : la más fuerte, pero lenta
model = qwen3.8-flash
# RAZONAMIENTO: el endpoint token-plan razona POR DEFECTO con qwen3.8-flash:
# 2-3 min por jugada real (medido). Con false responde en ~2 s (verificado en
# vivo 2026-10-20). true = juega más fuerte pero 2-3 min/jugada.
# Déjalo VACÍO para no mandar el flag (endpoints que no lo conocen).
enable_thinking = false
# LEGACY opcional y DESACONSEJADO (último recurso). Orden de resolución de la
# key (ver key_source.py y README): 1) variable de entorno QWEN_API_KEY,
# 2) casilla de la página de emparejamiento (solo en memoria del proceso),
# 3) este fichero, SOLO si existe. Un secreto en disco es el punto débil del
# flujo: rota la key si alguna vez vivió aquí y prefiere env o formulario.
key_file = qwen.key

[webmcp]
# puerto del daemon relay @jason.today/webmcp (histórico del paquete)
port = 4797

[site]
# 8088 es el puerto histórico del runbook Nivel 0 (el 8000 lo usa godot-ai;
# file:// no arranca el wasm; localhost pasa el DomainGuard del wrapper)
http_port = 8088
web_dir = web
game_path = /games/checkers/
game_path_es = /es/juegos/checkers/
# canal de producción (los enlaces se listan en la terminal y en PAIRING;
# el emparejamiento funciona desde CUALQUIER origen, ver README)
prod_origin = https://tabandblank.com

[agent]
difficulty = medium
# 20 s < 30 s: el relay del puente corta CUALQUIER tools/call a los 30 s
# (verificado en la fuente v0.1.12/0.1.13). Nunca dejes el default 60 del glue.
wait_seconds = 20
max_turns = 120
# timeout por llamada al LLM: con thinking off 90 s sobra (respuesta típica
# ~2 s). Sube a 180+ solo si pones enable_thinking = true (2-3 min/jugada).
llm_timeout = 90
